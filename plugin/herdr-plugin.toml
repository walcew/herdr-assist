# Plugin herdr-assist: sobe a ponte TCP que o painel físico usa para falar
# com este Herdr. Instalação num host novo:
#   herdr plugin install walcew/herdr-assist/plugin
# Depois disso a ponte se atualiza sozinha (ver update.py): compara esta
# `version` com a do release mais novo e reinstala. AUTO_UPDATE=0 no arquivo
# `env` do config-dir desliga.
# Para desenvolver, o caminho é git clone + herdr plugin link herdr-assist/plugin
# — checkout linkado nunca é reinstalado por cima.
# O token de autenticação é gerado na primeira subida (ação show-token exibe).

id = "herdr-assist"
name = "herdr-assist bridge"
# É a tag do release, sem o `v`: o auto-update compara esta linha com o
# manifest.json publicado, e o release.yml trava a publicação se as duas
# divergirem.
version = "0.10.0"
min_herdr_version = "0.8.0"
# Os títulos e descrições abaixo ficam em inglês: o manifest é lido pelo Herdr
# uma vez, sem campo por idioma, então não há como acompanhar o idioma do painel
# nem o locale do host. Inglês é o denominador comum de um repo público.
description = "Bridge for the herdr-assist desk panel — session state, live terminals and usage limits on an ESP32-S3 touchscreen, over authenticated TCP"
# windows entrou na 0.5.0: lá a ponte fala com o Herdr pela CLI, porque o
# socket é um named pipe que o Python não alcança (ver USE_CLI na ponte).
platforms = ["macos", "linux", "windows"]

# Roda quando o Herdr sobe a sessão; o script destaca a ponte e sai
# (startup de plugin não é daemon — precisa terminar). Python e não shell: o
# Windows não tem sh nem nohup, e a ponte já exige python3 de qualquer forma.
[[startup]]
command = ["python3", "start.py"]

# Tela de administração: status, token, pareamento e reinício num lugar só.
# É a superfície principal — as ações abaixo são atalhos para casos pontuais.
# Popup (não overlay: aquele toma a tela inteira). Dimensões externas em
# células, com borda: 76 porque o menu do admin tem ~70 colunas em pt_BR,
# 22 porque o pareamento lista até 4 dispositivos com os prompts em volta.
[[panes]]
id = "admin"
title = "herdr-assist"
placement = "popup"
width = 76
height = 22
command = ["python3", "admin.py"]

# contexts é o que faz a ação aparecer nos menus do Herdr; sem ele, a ação
# existe mas só pode ser chamada pela CLI. "global" porque nenhuma delas
# depende do workspace/aba/pane em foco.
# contexts declara em quais contextos a ação é válida e o que ela recebe em
# HERDR_PLUGIN_* — não é menu: o Herdr 0.8.0 não lista ações de plugin em menu
# algum (os itens do menu de contexto são fixos). Quem chama é um keybinding
# (`type = "plugin_action"`, ver README), a CLI ou um link handler.
# HERDR_BIN_PATH em vez de "herdr": o comando roda com o PATH do ambiente do
# plugin, onde o binário pode não estar (é o caso de um Homebrew não exportado).
[[actions]]
id = "admin"
title = "Open admin panel"
contexts = ["global", "workspace", "tab", "pane"]
command = ["python3", "open_admin.py"]

[[actions]]
id = "show-token"
title = "Show panel token"
contexts = ["global"]
command = ["python3", "show_token.py"]

[[actions]]
id = "restart-bridge"
title = "Restart the bridge"
contexts = ["global"]
command = ["python3", "start.py", "--restart"]
