# Plugin herdr-assist: sobe a ponte TCP que o painel físico usa para falar
# com este Herdr. Instalação num host novo:
#   git clone git@github.com:walcew/herdr-assist.git
#   herdr plugin link herdr-assist/plugin
# O token de autenticação é gerado na primeira subida (ação show-token exibe).

id = "herdr-assist"
name = "herdr-assist bridge"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Ponte TCP autenticada entre o Herdr e o painel físico herdr-assist"
platforms = ["macos", "linux"]

# Roda quando o Herdr sobe a sessão; o script destaca a ponte e sai
# (startup de plugin não é daemon — precisa terminar).
[[startup]]
command = ["./start.sh"]

# Tela de administração: status, token, pareamento e reinício num lugar só.
# É a superfície principal — as ações abaixo são atalhos para casos pontuais.
[[panes]]
id = "admin"
title = "herdr-assist"
description = "Ponte do painel: status, token e pareamento"
placement = "overlay"
command = ["python3", "admin.py"]

# contexts é o que faz a ação aparecer nos menus do Herdr; sem ele, a ação
# existe mas só pode ser chamada pela CLI. "global" porque nenhuma delas
# depende do workspace/aba/pane em foco.
# contexts nomeia os menus onde a ação aparece. A de administração vai em
# todos os que se abrem por toque/clique (o menu do pane é o do botão direito),
# porque é o ponto de entrada de quem acabou de instalar o plugin.
# HERDR_BIN_PATH em vez de "herdr": o comando roda com o PATH do ambiente do
# plugin, onde o binário pode não estar (é o caso de um Homebrew não exportado).
[[actions]]
id = "admin"
title = "Abrir painel de administração"
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "-c", "\"$HERDR_BIN_PATH\" plugin pane open --plugin herdr-assist --entrypoint admin"]

[[actions]]
id = "show-token"
title = "Mostrar token do painel"
contexts = ["global"]
command = ["sh", "-c", "cat \"$HERDR_PLUGIN_CONFIG_DIR/token\""]

[[actions]]
id = "restart-bridge"
title = "Reiniciar a ponte"
contexts = ["global"]
command = ["./start.sh", "--restart"]
