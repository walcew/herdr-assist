; herdr-assist para M5Stack Cardputer (StampS3, 240x135, teclado de 56 teclas).
;
; Projeto separado do painel de 3,5": lá é ESP-IDF + LVGL, aqui é Arduino +
; M5GFX, porque a lib oficial do Cardputer (teclado e display) é Arduino. O que
; é protocolo puro (term_parse, discovery) vem do firmware do painel por cópia
; no build — ver sync_shared.py.

[platformio]
description = herdr-assist Cardputer
default_envs = cardputer
boards_dir = boards
src_dir = src

[env:cardputer]
; a série 55.x é o pioarduino (Arduino core 3.x / IDF 5.5); a 6.x oficial ficou
; no Arduino 2.0 e não tem board para o StampS3 com CDC ligado por padrão.
; Pela URL da release, e não espressif32@^55: o registry do PlatformIO não
; serve o pioarduino sob esse nome — o spec só resolvia numa máquina que já o
; tivesse instalado por zip. Versão exata para o build (e o cache do CI) ser
; reprodutível.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack-cardputer
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 1500000

lib_deps =
	m5stack/M5Cardputer@^1.0.3

extra_scripts = pre:sync_shared.py

build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=1
	; HERDR_ASSIST_VERSION vem do sync_shared.py (version.txt do CI ou git describe)
	; módulos compartilhados com o painel, copiados para src/shared no build
	-Isrc/shared
	; o cJSON vem junto do framework (libjson.a já entra no link), mas o
	; include não está no caminho padrão do Arduino
	-I"${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/json/cJSON"
	; os buffers do painel são dimensionados para 320x480 com 8MB de PSRAM;
	; aqui a tela trava o pane em ~40 colunas e o S3FN8 não tem PSRAM nenhuma
	-DTERM_MAX_LINES=48
	-DTERM_MAX_COLS=80
	-DTERM_MAX_RUNS=768
	-DTERM_TEXT_CAP=8192
	-DHERDR_RX_BUF_LEN=16384
