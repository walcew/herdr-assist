; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = LVGL-320-480
default_envs = LVGL-320-480
boards_dir = boards
data_dir = littlefs
lib_dir = libraries
src_dir = src

[libraries]

[com]
platform = espressif32@6.6.0
board = esp32s3dev
monitor_filters = esp32_exception_decoder
framework = espidf
build_type = debug
board_build.filesystem = littlefs
build_flags =
	-D LOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	; Fork custom (Goku/Spider-Man): desliga a checagem de OTA — o aviso de
	; "atualização disponível" some (build local = versão -dirty ≠ release) e o
	; painel nunca se auto-substitui pelo release upstream. A confirmação de
	; rollback no boot continua (fw_update_init). Remova para reativar o OTA.
	-D HERDR_DISABLE_OTA
lib_deps = 


[env:LVGL-320-480]
platform = ${com.platform}
board = 320x480
board_build.partitions = partitions.csv
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = ${com.board_build.filesystem}
lib_deps =
build_flags =
	${com.build_flags}
; LV_CONF_PATH é definido em scripts/pio_lvconf.py com barras "/" (o
; ${PROJECT_DIR} do Windows traz "\" que o build come ao montar o -D).
extra_scripts = pre:scripts/pio_lvconf.py
